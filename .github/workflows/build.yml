name: DevSecOps Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Important: SonarCloud needs full git history to work

      # --- SECURITY STEP 1: GitGuardian (Secret Scanning) ---
      - name: GitGuardian Scan
        uses: gitguardian/ggshield-action@master
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base_ref }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # --- SECURITY STEP 2: Snyk (Dependency Vulnerabilities) ---
      - name: Install Snyk CLI
        uses: snyk/actions/setup@master

      - name: Snyk Security Scan
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          chmod +x mvnw
          snyk test --all-projects --severity-threshold=high

      # --- SECURITY STEP 3: SonarCloud (Code Quality & Security Hotspots) ---
      # This replaces the standard "mvn verify" because Sonar runs during the build
      - name: Build and Analyze with SonarCloud
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
          -Dsonar.projectKey=matiso23_ecommerce-api-spring-kafka \
          -Dsonar.organization=matiso23 \
          -Dsonar.host.url=https://sonarcloud.io

      # --- QUALITY GATES ---
      - name: Run Mutation Testing (PIT)
        run: mvn -B org.pitest:pitest-maven:mutationCoverage

      - name: Upload PIT Mutation Report
        uses: actions/upload-artifact@v4
        with:
          name: pit-mutation-report
          path: target/pit-reports/

      - name: Generate JaCoCo Badge
        uses: cicirello/jacoco-badge-generator@v2
        with:
          generate-branches-badge: true
          jacoco-csv-file: target/site/jacoco/jacoco.csv

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Commit Coverage Badge
        continue-on-error: true
        run: |
          if [[ `git status --porcelain` ]]; then
            git config --global user.name 'github-actions'
            git config --global user.email 'github-actions@github.com'
            BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
            git fetch origin $BRANCH_NAME
            git checkout -B $BRANCH_NAME origin/$BRANCH_NAME
            git add -A
            git commit -m "Autogenerated JaCoCo coverage badge"
            git pull --rebase origin $BRANCH_NAME
            git push origin $BRANCH_NAME
          fi

  docker:
    name: Docker Build & Push
    needs: build
    runs-on: ubuntu-latest
    # Removed environment: production to prevent waiting for approval

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/ecommerce-api
          tags: |
            type=raw,value=${{ needs.build.outputs.tag }}
            type=sha,format=long
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}